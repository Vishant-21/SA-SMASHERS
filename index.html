 * Storage abstraction for SchoolShield — backed by Supabase.
 *
 * Fill in your project's URL and anon public key below (Project Settings
 * → API in your Supabase dashboard). The anon key is meant to be public;
 * access control is enforced by your Row Level Security policy on the
 * `kv_store` table, not by keeping this key secret.
 *
 * Requires a table created with:
 *   create table kv_store (
 *     key text primary key,
 *     value text not null,
 *     updated_at timestamptz default now()
 *   );
 * ...with RLS enabled and a policy allowing the operations you need
 * (see the "public read/write for demo" policy from setup).
 *
 * Keeping the same get/set/delete/list(prefix) shape means nothing else
 * in this file needs to change now that it's wired to a real backend.
 */

    async get(key, _shared) {
        const { data, error } = await sb
            .from("kv_store")
            .select("value")
            .eq("key", PREFIX + key)
            .single();
        if (error || !data) {
            throw new Error(`Key not found: ${key}`);
        }
        return { key, value: data.value, shared: !!_shared };
    },
    async set(key, value, _shared) {
        const { error } = await sb
            .from("kv_store")
            .upsert({ key: PREFIX + key, value });
        if (error) {
            throw error;
        }
        return { key, value, shared: !!_shared };
    },
    async delete(key, _shared) {
        const { error } = await sb
            .from("kv_store")
            .delete()
            .eq("key", PREFIX + key);
        return { key, deleted: !error, shared: !!_shared };
    },
    async list(prefix = "", _shared) {
        const { data, error } = await sb
            .from("kv_store")
            .select("key")
            .like("key", `${PREFIX}${prefix}%`);
        if (error) {
            throw error;
        }
        const keys = (data || []).map((r) => r.key.slice(PREFIX.length));
        return { keys, prefix, shared: !!_shared };
    },
};

.college-pick-chip { text-align: left; padding: 14px 16px; font-size: 14.5px; font-weight: 650; }

.staff-main { flex: 1; }

.stat-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-block { flex: 1; min-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; border-top: 3px solid var(--orange); }
.stat-row .stat-block:nth-child(2) { border-top-color: var(--teal-700); }
.stat-row .stat-block:nth-child(3) { border-top-color: #ef4444; }
.stat-row .stat-block:nth-child(4) { border-top-color: var(--amber-500); }
.stat-num { font-family: 'Sora'; font-size: 28px; font-weight: 800; color: var(--ink); }
.stat-num.accent-high { color: #ef4444; }
.stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; font-weight: 650; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 20px 22px; margin-bottom: 16px; }
.panel-title { font-family: 'Sora'; font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 14px; }
.panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.trend-svg { width: 100%; height: 160px; }
.trend-axis { stroke: var(--line); stroke-width: 1; }
.trend-area { fill: var(--orange-mist); opacity: 0.8; }
.trend-line { fill: none; stroke: var(--orange-deep); stroke-width: 2; }
.trend-dot { fill: var(--orange-deep); }
.trend-tick { font-size: 9px; fill: #a2a9b5; font-family: 'Inter'; }

.barlist { display: flex; flex-direction: column; gap: 12px; }
.barrow { display: grid; grid-template-columns: 120px 1fr 26px; align-items: center; gap: 10px; }
.barrow-label { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barrow-track { background: var(--paper); border-radius: 5px; height: 9px; overflow: hidden; }
.barrow-fill { height: 100%; border-radius: 5px; }
.barrow-value { font-size: 12px; color: var(--ink-soft); text-align: right; font-weight: 650; }

.filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.select-input { width: auto; margin-top: 0; padding: 9px 12px; font-size: 12.5px; font-weight: 650; background: #fff; }
.filter-count { font-size: 12.5px; color: var(--ink-soft); margin-left: auto; font-weight: 650; }

.report-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.report-row {
  display: grid; grid-template-columns: 16px 140px 1fr 150px 110px; align-items: center; gap: 14px;
  padding: 13px 18px; border-bottom: 1px solid var(--line); background: none; border-left: none; border-right: none; border-top: none;
  text-align: left; cursor: pointer; font-size: 13.5px; color: var(--ink); width: 100%;
}
.report-row:last-child { border-bottom: none; }
.report-row:hover { background: #fff7ef; }
.report-row-type { font-weight: 650; }
.report-row-loc { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.report-row-date { color: var(--ink-soft); font-size: 12.5px; }
.status-pill { border: 1px solid; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; justify-self: start; }

.sev-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.sev-dot.sev-low { background: #22c55e; }
.sev-dot.sev-medium { background: var(--amber-500); }
.sev-dot.sev-high { background: #ef4444; }

.empty-state { padding: 30px 0; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(30,25,20,0.45); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal { background: #fff; border-radius: 18px; padding: 26px; max-width: 500px; width: 100%; max-height: 88vh; overflow-y: auto; position: relative; box-shadow: 0 24px 60px rgba(0,0,0,0.22); }
.modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer; line-height: 1; }
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.modal-sev { font-size: 12px; color: var(--ink-soft); }
.modal h3 { font-size: 18px; color: var(--ink); margin-top: 4px; }
.modal-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tag { background: var(--orange-mist); color: var(--orange-deep); font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.modal-desc { margin-top: 14px; font-size: 14px; line-height: 1.6; color: var(--ink); }
.modal-photo { margin-top: 12px; max-width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.modal-status { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }

.reply-thread { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 2px; }
.reply-bubble { max-width: 78%; border-radius: var(--radius-sm); padding: 9px 13px; align-self: flex-start; background: var(--teal-mist); }
.reply-bubble.is-mine, .reply-bubble.is-from-student { align-self: flex-end; background: linear-gradient(135deg, var(--orange), #ff5f7d); }
.reply-bubble.is-mine p, .reply-bubble.is-from-student p { color: #fff; }
.reply-bubble.is-mine .reply-date, .reply-bubble.is-from-student .reply-date { color: rgba(255,255,255,0.75); }
.reply-bubble.is-mine .reply-sender, .reply-bubble.is-from-student .reply-sender { color: rgba(255,255,255,0.75); }
.reply-sender { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); margin-bottom: 2px; }
.reply-bubble p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
.reply-date { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.reply-empty { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 4px; }

.reply-thread-title { font-family: 'Sora'; font-weight: 650; font-size: 13.5px; color: var(--ink); margin-bottom: 4px; }

.reply-composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
.reply-composer-input { margin-top: 0; flex: 1; resize: none; }

.modal-replies { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
.modal-replies .textarea-input { margin-top: 10px; }
.reply-thread-staff { margin-top: 0; margin-bottom: 4px; }
.reply-send-btn { margin-top: 10px; flex-shrink: 0; }
.status-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.status-btn { padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; color: var(--ink-soft); font-weight: 650; }
.status-btn.is-active { background: var(--orange); border-color: var(--orange); color: #fff; }

.tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
.tip-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 20px; }
.tip-icon { font-size: 22px; display: block; margin-bottom: 10px; }
.tip-card h3 { font-size: 15.5px; color: var(--ink); margin-bottom: 10px; }
.tip-card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.tip-card li { font-size: 13px; color: var(--ink); line-height: 1.5; }

footer.site-foot { border-top: 1px solid var(--line); padding: 18px 32px 30px; text-align: center; color: var(--ink-soft); font-size: 12px; }

@media (max-width: 860px) {
  .app-shell { flex-direction: column; }
  .app-sidebar { position: static; width: 100%; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 12px 14px; gap: 6px; }
  .brand { padding: 0 10px 0 0; }
  .nav-label, .privacy-card, .nav-spacer { display: none; }
  .nav-item { white-space: nowrap; margin-bottom: 0; }
  .app-main { padding: 24px 18px 50px; }
  .panel-grid { grid-template-columns: 1fr; }
  .report-row { grid-template-columns: 14px 1fr; grid-template-areas: "dot type" "dot loc" "dot date" "dot status"; row-gap: 3px; }
  .stat-row { flex-wrap: wrap; }
  .stat-block { min-width: 45%; }
}
`;
ReactDOM.render(React.createElement(SchoolShieldApp, null), document.getElementById("root"));

</script>
</body>
</html>
